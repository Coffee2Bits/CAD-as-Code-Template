[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "programmatic-cad-workspace"
version = "0.0.1"
description = "Programmatic CAD modeling workspace using build123d"
requires-python = ">=3.11"
dependencies = [
  "build123d",
  "ocp-vscode",
  "numpy",
  "trimesh",
  "makerrepo>=0.5.6",
]

[tool.hatch.build.targets.wheel]
packages = ["cad", "cad_tooling"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "ocp-viewer-mcp>=0.1.0",
  "makerrepo-cli>=0.3.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"cad/parts/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests", "cad_tooling_tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
