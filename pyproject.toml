[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "programmatic-cad-workspace"
version = "0.1.1"
description = "Programmatic CAD modeling workspace using build123d"
requires-python = ">=3.11"
dependencies = [
  "build123d",
  "ocp-vscode",
  "numpy",
  "trimesh",
  "makerrepo>=0.5.6",
  # Optional build123d part libraries — uncomment as needed, then run `uv sync`
  # (see README → References for descriptions and source links).
  # "bd_warehouse>=0.2.0",
  # "bd-vslot",
  # "bd_beams_and_bars @ git+https://gitlab.com/experimentslabs/3d/bd_beams_and_bars.git",
  # "py_gearworks @ git+https://github.com/GarryBGoode/py_gearworks.git",
  "bd-warehouse>=0.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cad", "cad_tooling"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit>=4.0.0",
  "ocp-viewer-mcp>=0.1.0",
  "makerrepo-cli>=0.3.6",
  "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"cad/parts/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests", "cad_tooling_tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "unit: fast logic, config, and discovery tests (no CAD build or subprocess isolation)",
    "integration: CAD geometry, export pipelines, and release smoke paths",
    "render: headless OCP PNG rendering (combine with integration on render tests)",
    "functional: isolated just CLI recipes in a temp workspace copy",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true

[tool.vulture]
paths = ["cad", "cad_tooling", "tests", "cad_tooling_tests", "main.py", "scripts", "ci/src", "pytest_support.py"]
exclude = [
  ".venv",
  "ci/.venv",
  "ci/sdk",
  "website",
  "dist",
  "**/__pycache__",
]
ignore_decorators = [
  "@artifact",
  "@customizable",
  "@cached",
  "@render",
  "@function",
  "@pytest.fixture",
]
min_confidence = 80
