# Repository identity for this CAD-as-Code workspace.
#
# After "Use this template", edit this file for your org and repo name, then run:
#   just template-apply
#
# GitHub Actions workflows use ${{ github.repository }} automatically — no workflow edits needed.

[github]
owner = "Coffee2Bits"
repo = "CAD-as-Code-Template"

[pages]
# GitHub Pages host for a project site (usually https://<owner>.github.io)
url = "https://coffee2bits.github.io"

[docs]
title = "CAD-as-Code Template"
navbar_title = "CAD-as-Code"
tagline = "Turnkey parametric CAD in Python"

[python]
# pyproject.toml [project] name
package_name = "programmatic-cad-workspace"

[copyright]
holder = "Coffee2Bits"
