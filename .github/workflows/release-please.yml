name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only open/update Release PRs. Tagging and GitHub Releases are handled
          # below when a Release PR squash-merge lands on main.
          skip-github-release: true

      - name: Detect merged Release PR
        id: publish
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${COMMIT_SUBJECT%%$'\n'*}"
          if [[ "$subject" =~ ^chore:\ release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: actions/checkout@v4

      - name: Export release assets
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: release-artifact --source=. export --path=./dist
          dagger-flags: "--progress plain"

      - name: Set up Python
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: astral-sh/setup-uv@v5

      - name: Generate release notes
        if: ${{ steps.publish.outputs.publish == 'true' }}
        run: |
          uv sync --group dev --frozen
          uv run python -m cad_tooling.export release-notes \
            --assets-dir dist \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.publish.outputs.tag_name }}" \
            -o dist/RELEASE_BODY.md

      - name: Create or update GitHub Release
        if: ${{ steps.publish.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ steps.publish.outputs.tag_name }}"
          assets=(dist/*.stl dist/*.png)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "${{ github.repository }}" "${assets[@]}" --clobber
            gh release edit "$tag" --repo "${{ github.repository }}" --notes-file dist/RELEASE_BODY.md
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --notes-file dist/RELEASE_BODY.md \
              "${assets[@]}"
          fi
