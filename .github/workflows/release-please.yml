name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Export release assets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: release-artifact --source=. export --path=./dist
          dagger-flags: "--progress plain"

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: astral-sh/setup-uv@v5

      - name: Generate release notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          uv sync --group dev --frozen
          uv run python -m cad_tooling.export release-notes \
            --assets-dir dist \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.release.outputs.tag_name }}" \
            -o dist/RELEASE_BODY.md

      - name: Upload release assets and update notes
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.stl dist/*.png)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          gh release upload "${{ steps.release.outputs.tag_name }}" "${assets[@]}" --clobber
          gh release edit "${{ steps.release.outputs.tag_name }}" --notes-file dist/RELEASE_BODY.md
