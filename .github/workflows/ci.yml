name: CI

on:
  push:
    branches: [main]
    paths:
      - "cad/**"
  pull_request:
    branches: [main]
    paths:
      - "cad/**"

jobs:
  check:
    name: Dagger CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checks
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: check --source=.
          dagger-flags: "--progress plain"
