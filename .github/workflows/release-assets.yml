name: Publish release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to export and upload (for example v0.3.0)
        required: true
        type: string

jobs:
  publish:
    name: Export and upload STL/PNG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Export release assets
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: release-artifact --source=. export --path=./dist
          dagger-flags: "--progress plain"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Generate release notes
        run: |
          uv sync --group dev --frozen
          uv run python -m cad_tooling.export release-notes \
            --assets-dir dist \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag }}" \
            -o dist/RELEASE_BODY.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            dist/*.stl
            dist/*.png
          body_path: dist/RELEASE_BODY.md
