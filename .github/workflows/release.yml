name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    name: Quality gate
    if: github.ref_name =~ '^v[0-9]+\.[0-9]+\.[0-9]+$'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checks
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: check --source=.
          dagger-flags: "--progress plain"

  release:
    name: Publish release assets
    needs: check
    if: github.ref_name =~ '^v[0-9]+\.[0-9]+\.[0-9]+$'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export release assets
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: release-artifact --source=. export --path=./dist
          dagger-flags: "--progress plain"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Generate release notes
        run: |
          uv sync --group dev --frozen
          uv run python -m cad_tooling.export release-notes \
            --assets-dir dist \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            -o dist/RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.stl
            dist/*.png
          body_path: dist/RELEASE_BODY.md
