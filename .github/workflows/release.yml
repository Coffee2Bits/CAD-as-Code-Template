name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish assets for (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Run checks
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.4"
          verb: call
          module: ./ci
          args: check --source=.
          dagger-flags: "--progress plain"

  publish:
    name: Publish release assets
    needs: check
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
