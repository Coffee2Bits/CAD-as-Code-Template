default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: conventional-commit-msg
        name: Conventional Commit subject
        entry: uv run python scripts/validate_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
